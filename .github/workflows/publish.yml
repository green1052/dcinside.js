name: CI
on:
    push:
        branches:
            - master

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            -   uses: actions/checkout@v7

            -   uses: oven-sh/setup-bun@v2

            -   run: bun ci

            -   run: bun run typecheck

            -   run: bun test

            -   run: bun run build

            -   uses: actions/setup-node@v7
                with:
                    node-version: latest

            -   name: Publish
                run: |
                    VERSION=$(node -p "require('./package.json').version")
                    if npm view "@green-1052/dcinside.js@$VERSION" version >/dev/null 2>&1; then
                        echo "skip: $VERSION already on npm"
                    else
                        npm publish
                        # 기존 컨벤션대로 v 접두사 없는 주석 태그를 만듭니다.
                        git tag -a "$VERSION" -m "$VERSION"
                        git push origin "$VERSION"
                    fi
