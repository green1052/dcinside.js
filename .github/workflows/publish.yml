name: CI
on:
    push:
        branches:
            - master
        paths:
            - package.json

jobs:
    build-and-publish:
        # renovate 의존성 뱅프도 package.json을 고치므로 작성자로 걸러냅니다.
        if: ${{ github.event.head_commit.author.username != 'renovate[bot]' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            -   uses: actions/checkout@v7

            -   uses: oven-sh/setup-bun@v2

            -   run: bun ci

            -   run: bun run typecheck

            -   run: bun test

            -   run: bun run build

            -   uses: actions/setup-node@v7
                with:
                    node-version: latest

            -   name: Publish
                run: |
                    VERSION=$(node -p "require('./package.json').version")
                    if npm view "@green-1052/dcinside.js@$VERSION" version >/dev/null 2>&1; then
                        echo "skip: $VERSION already on npm"
                    else
                        npm publish
                        git config user.name "green1052"
                        git config user.email "green1052@pm.me"
                        git tag -a "$VERSION" -m "$VERSION"
                        git push origin "$VERSION"
                    fi
